# Windows build: compile, test, bundle, validate, and package the VST3 + CLAP.
#
# No AU job: clap-wrapper is cfg-gated to macOS and drops out of Windows builds.
# pluginval runs with --skip-gui-tests because the hosted runners have no GPU —
# the editor (baseview Win32 + egui_glow) may fail to create a GL context there,
# and a headless CI pass would say nothing about it anyway; the GUI needs real
# hardware. clap-validator exits 0 even with failures, so the step counts them
# and tolerates exactly the 4 known upstream nih-plug issues (see CLAUDE.md,
# "Known upstream issues"); a 5th failure fails the build.
#
# Packaging produces an Inno Setup installer, ConjureAlign-<v>-Windows-Setup.exe,
# which replaced a zip users hand-copied into Common Files. It is UNSIGNED, so
# SmartScreen warns on first download; accepted, since a code-signing certificate
# is the only fix. Inno Setup 6 is preinstalled on the runner image, so `iscc`
# needs no install step.
#
# The installer is smoke-tested end to end here — install, install again over
# planted mis-installs, uninstall — because an Inno 6 installer cannot be
# unpacked offline (7-Zip does not read the format, innoextract lags by years)
# and this runner is the only Windows machine the project has.
#
# On a v* tag push, the installer is attached to that tag's GitHub Release if one
# exists (create the release first, or re-run the job after creating it).

name: Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Hoisted out of the Package step so the pwsh verification below can use
      # it too. $GITHUB_ENV reaches subsequent steps only, never this one.
      - name: Resolve version
        shell: bash
        run: echo "VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)" >> "$GITHUB_ENV"

      - name: Install stable Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: Test (release)
        shell: bash
        run: cargo test --release

      - name: Bundle
        shell: bash
        run: cargo xtask bundle conjure_align --release

      # build.rs stamps a VS_VERSION_INFO resource into the cdylib so an
      # installed plugin can be asked which build it is. Nothing about
      # `strip = "symbols"`, `lto = "thin"` or nih_plug_xtask's reflink copy
      # should disturb it — but this is the only Windows machine the project
      # has, so it is asserted rather than assumed.
      #
      # Asserted on the BUNDLED files, not just target/release: those are what
      # users actually get, and checking them also proves the rename into the
      # bundle preserved the resource.
      #
      # pwsh, not bash: Get-Item's .VersionInfo goes through the same
      # GetFileVersionInfo call a support thread would use, and is
      # extension-independent (Explorer's property sheet is not — it resolves
      # per-extension, and .vst3/.clap have no registered handler, so
      # right-click → Properties will NOT show a version).
      - name: Verify the embedded version resource
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = "${{ env.VERSION }}"
          $major = [int]$expected.Split('.')[0]
          foreach ($f in @(
              'target/bundled/ConjureAlign.vst3/Contents/x86_64-win/ConjureAlign.vst3',
              'target/bundled/ConjureAlign.clap',
              'target/release/conjure_align.dll')) {
            if (-not (Test-Path $f)) { throw "missing build output: $f" }
            $vi = (Get-Item $f).VersionInfo
            Write-Host "$f"
            Write-Host "  FileVersion='$($vi.FileVersion)' ProductVersion='$($vi.ProductVersion)'"
            Write-Host "  ProductName='$($vi.ProductName)' CompanyName='$($vi.CompanyName)'"
            # The string block, which is what the support one-liner reads.
            if ($vi.FileVersion -ne $expected) {
              throw "$f has FileVersion '$($vi.FileVersion)', expected '$expected' (resource missing or stale?)"
            }
            # The binary VS_FIXEDFILEINFO block, which is a separate field and
            # can be wrong while the string one is right.
            if ($vi.FileMajorPart -ne $major) {
              throw "$f VS_FIXEDFILEINFO major is $($vi.FileMajorPart), expected $major"
            }
          }

      # Turns a shipped crash report into function names. [profile.release] keeps
      # `strip = "symbols"`, so the .dll carries none and the .pdb beside it holds
      # everything; Sentry matches the two by build id.
      #
      # Skips itself when the credentials are absent rather than failing, so forks
      # and PRs (which get no secrets) still build green. SENTRY_ORG / SENTRY_PROJECT
      # are repository variables, not secrets — they are slugs, not credentials.
      - name: Upload debug symbols to Sentry
        shell: bash
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: |
          if [ -z "${SENTRY_AUTH_TOKEN:-}" ] || [ -z "${SENTRY_ORG:-}" ] || [ -z "${SENTRY_PROJECT:-}" ]; then
            echo "SENTRY_AUTH_TOKEN / SENTRY_ORG / SENTRY_PROJECT not all set; skipping symbol upload."
            exit 0
          fi
          npm install -g @sentry/cli
          # Only our own cdylib. Pointing this at target/release uploads the whole
          # build tree — 334 files on the first run, of which 3 mattered; the rest
          # were every dependency's build_script_build, the proc-macro dlls, the
          # test binaries and xtask. None of those can ever appear in a plugin
          # crash report, and --include-sources bundles their source as well.
          # Cargo uplifts the artifact to target/release but also leaves it in
          # deps/, and which one exists is not worth depending on; Sentry dedupes
          # by debug id, so listing both is free.
          PATHS=""
          for f in target/release/conjure_align.pdb \
                   target/release/conjure_align.dll \
                   target/release/deps/conjure_align.pdb \
                   target/release/deps/conjure_align.dll; do
            [ -e "$f" ] && PATHS="$PATHS $f"
          done
          if [ -z "$PATHS" ]; then
            echo "WARNING: no conjure_align debug files found; skipping upload."
            exit 0
          fi
          echo "Uploading:$PATHS"
          sentry-cli debug-files upload --include-sources $PATHS

      - name: Download validators
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p validators
          gh release download v1.0.4 --repo Tracktion/pluginval --pattern 'pluginval_Windows.zip' --dir validators
          gh release download 0.4.1 --repo free-audio/clap-validator --pattern '*windows.zip' --dir validators
          (cd validators && 7z x -y pluginval_Windows.zip >/dev/null && 7z x -y clap-validator-*.zip >/dev/null)

      - name: pluginval (VST3, strictness 10)
        shell: bash
        run: |
          PV=$(find validators -iname 'pluginval*.exe' | head -1)
          "$PV" --strictness-level 10 --skip-gui-tests --validate target/bundled/ConjureAlign.vst3

      - name: clap-validator (CLAP)
        shell: bash
        run: |
          CV=$(find validators -iname 'clap-validator*.exe' | head -1)
          # clap-validator exits non-zero whenever any test fails, and this shell
          # runs with -e -o pipefail — neutralize that so the known-failure gate
          # below is what decides the step's outcome.
          "$CV" validate target/bundled/ConjureAlign.clap 2>&1 \
            | sed 's/\x1b\[[0-9;]*m//g' | tee clapval.txt || true
          SUMMARY=$(grep -E '[0-9]+ tests run' clapval.txt || true)
          if [ -z "$SUMMARY" ]; then
            echo "::error::clap-validator produced no summary (crashed?)"
            exit 1
          fi
          FAILED=$(echo "$SUMMARY" | grep -oE '[0-9]+ failed' | grep -oE '[0-9]+' || echo 0)
          echo "$SUMMARY"
          if [ "$FAILED" -gt 4 ]; then
            echo "::error::$FAILED CLAP validation failures — more than the 4 known upstream nih-plug issues"
            exit 1
          fi

      - name: Build installer (Inno Setup)
        shell: bash
        run: |
          rm -rf dist
          mkdir -p dist/stage
          cp -R target/bundled/ConjureAlign.vst3 target/bundled/ConjureAlign.clap dist/stage/
          # CRLF: Inno renders LicenseFile in a rich-text control, and these also
          # end up double-clickable in Notepad next to the uninstaller.
          sed 's/$/\r/' LICENSE                      > dist/stage/LICENSE.txt
          sed 's/$/\r/' THIRD-PARTY.md               > dist/stage/THIRD-PARTY.md
          sed 's/$/\r/' packaging/windows/README.txt > dist/stage/README.txt

          # ISCC reads the version from the environment rather than /DName=value;
          # see the .iss header for why (Git Bash mangles leading slashes).
          export CONJUREALIGN_VERSION="$VERSION"
          # Inno Setup 6 is preinstalled on the runner image, with iscc on PATH
          # via the Chocolatey shim. The fallback is in case that shim moves.
          ISCC=$(command -v iscc || true)
          [ -n "$ISCC" ] || ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          "$ISCC" packaging/windows/ConjureAlign.iss
          ls -la dist
          # ISCC exits non-zero on a fatal error or a failed compile, which this
          # step's `bash -e` turns into a job failure. It exits 0 on warnings,
          # so also confirm the file landed where the .iss said it would.
          test -f "dist/ConjureAlign-$VERSION-Windows-Setup.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: ConjureAlign-${{ env.VERSION }}-Windows-Setup
          path: dist/ConjureAlign-*-Windows-Setup.exe

      # The runner IS a real Windows machine, and the only one this project has.
      # An Inno 6 installer cannot be unpacked offline — 7-Zip does not read the
      # format and innoextract lags Inno releases by years — so actually running
      # it here is not a nice-to-have, it is the only verification there is.
      #
      # Install, plant the two mis-install shapes [InstallDelete] exists for,
      # install over them, then uninstall. pwsh throughout: from `shell: bash`,
      # MSYS would rewrite /VERYSILENT into a Windows path.
      #
      # Runs AFTER the artifact upload, so a broken installer is still
      # downloadable for inspection, and BEFORE the release attach, so a broken
      # one can never reach a Release.
      - name: Installer smoke test (install / upgrade / uninstall)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver  = "${{ env.VERSION }}"
          $exe  = (Resolve-Path "dist/ConjureAlign-$ver-Windows-Setup.exe").Path
          $vst3 = 'C:\Program Files\Common Files\VST3\ConjureAlign.vst3'
          $clap = 'C:\Program Files\Common Files\CLAP\ConjureAlign.clap'
          $dll  = "$vst3\Contents\x86_64-win\ConjureAlign.vst3"
          # Same GUID as AppId in the .iss. Deliberately duplicated: changing one
          # without the other fails here rather than silently breaking upgrades
          # for every existing install.
          $arp  = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\{3447632D-7F44-44AD-9A1E-E4C24A33E998}_is1'
          $userVst3 = "$env:LOCALAPPDATA\Programs\Common\VST3"

          $id = [Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()
          Write-Host "elevated: $($id.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator))"

          function Invoke-Setup($file, $arguments, $what) {
            $p = Start-Process -FilePath $file -ArgumentList $arguments -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "$what exited $($p.ExitCode)" }
          }

          # --- phase 1: a loose-DLL mis-install present, then a clean install ---
          New-Item -ItemType Directory -Force -Path (Split-Path $vst3) | Out-Null
          # A FILE where the bundle directory belongs.
          Copy-Item 'target/bundled/ConjureAlign.clap' $vst3
          Invoke-Setup $exe @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/LOG=install1.log') 'install #1'
          if (-not (Get-Item $vst3).PSIsContainer) { throw 'loose ConjureAlign.vst3 file was not replaced by the bundle' }
          if (-not (Test-Path $dll))  { throw 'VST3 payload missing after install' }
          if (-not (Test-Path $clap)) { throw 'CLAP missing after install' }
          $arpVer = (Get-ItemProperty $arp).DisplayVersion
          if ($arpVer -ne $ver) { throw "Add/Remove DisplayVersion='$arpVer', expected '$ver'" }
          if ((Get-Item $dll).VersionInfo.FileVersion -ne $ver) { throw 'the installed VST3 lost its version resource' }

          # The installed copy is what users load, so validate that one, not the
          # build tree.
          $pv = (Get-ChildItem validators -Recurse -Filter 'pluginval*.exe' | Select-Object -First 1).FullName
          & $pv --strictness-level 10 --skip-gui-tests --validate $vst3
          if ($LASTEXITCODE -ne 0) { throw 'pluginval failed against the installed bundle' }

          # --- phase 2: bad-extraction leftover + per-user copy, install over ---
          $leftover = 'C:\Program Files\Common Files\VST3\ConjureAlign-1.2.0'
          New-Item -ItemType Directory -Force -Path "$leftover\ConjureAlign.vst3\Contents\x86_64-win" | Out-Null
          Copy-Item $dll "$leftover\ConjureAlign.vst3\Contents\x86_64-win\ConjureAlign.vst3"
          New-Item -ItemType Directory -Force -Path $userVst3 | Out-Null
          Copy-Item $dll "$userVst3\ConjureAlign.vst3"
          # A decoy that must survive: the sweep is scoped to our own names.
          Copy-Item $dll "$userVst3\SomeoneElse.vst3"
          Invoke-Setup $exe @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/LOG=install2.log') 'install #2'
          if (Test-Path $leftover)                      { throw 'bad-extraction leftover survived the sweep' }
          if (Test-Path "$userVst3\ConjureAlign.vst3") { throw 'per-user copy survived the sweep' }
          if (-not (Test-Path "$userVst3\SomeoneElse.vst3")) { throw 'the sweep removed another vendor''s plugin' }
          if (-not (Test-Path $dll))                    { throw 'reinstall over an existing install replaced nothing' }

          # --- phase 3: uninstall ------------------------------------------------
          $unins = (Get-ItemProperty $arp).UninstallString -replace '"',''
          Invoke-Setup $unins @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') 'uninstall'
          if (Test-Path $vst3) { throw 'VST3 survived uninstall' }
          if (Test-Path $clap) { throw 'CLAP survived uninstall' }
          if (Test-Path $arp)  { throw 'Add/Remove entry survived uninstall' }
          Write-Host 'installer smoke test passed'

      - name: Attach to release (tag builds)
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" dist/ConjureAlign-*-Windows-Setup.exe --clobber \
            || echo "::warning::no release exists for $GITHUB_REF_NAME yet — create it, then re-run this job to attach the installer"
