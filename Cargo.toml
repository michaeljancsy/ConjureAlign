[package]
name = "conjure_align"
# Bumping this changes the AudioUnit version in the generated Info.plist
# (0xMMMMmmbb), which is what makes Logic re-read a plugin's capabilities instead
# of reusing its cached Plug-in Manager entry.
version = "1.1.0"
edition = "2021"
authors = ["Michael Jancsy <michaeljancsy@gmail.com>"]
license = "GPL-3.0-or-later"
homepage = "https://github.com/michaeljancsy/ConjureAlign"
description = "Time-aligns a mic signal to a sidechain reference with sub-sample precision"

[workspace]
members = ["xtask"]

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", features = ["assert_process_allocs"] }
# Same git URL as nih_plug so Cargo resolves both at the single locked rev.
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug.git" }
realfft = "3.5"
atomic_refcell = "0.1"
# Must track the version nih_plug uses: its AtomicF32 implements nih_plug's
# PersistentField, which our #[persist] fields rely on.
atomic_float = "0.1"
# Dev-only, behind the `gui-preview` feature: headless rendering of the editor
# panels to a PNG (examples/gui_preview.rs). Optional regular deps instead of
# dev-deps so plain `cargo test` never builds the wgpu stack.
egui_kittest = { version = "0.31", features = ["wgpu"], optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
# Opt-in usage analytics (src/analytics.rs): the Mixpanel payload and the random
# device id. The TLS stack is target-gated below — see the note there.
serde_json = "1.0"
getrandom = "0.4"
# The persisted analysis snapshot (src/snapshot_persist.rs): serde derives the
# session-state DTO nih-plug's persist machinery (de)serializes, base64 carries
# the raw f32 sample bytes inside that JSON. Neither is new compilation work on
# the shipping targets — serde (with derive) is already in the graph via
# nih_plug, base64 via ureq.
serde = { version = "1.0", features = ["derive"] }
base64 = "0.23"

# AudioUnit v2 export (macOS only). clap-wrapper re-exports the `clap_entry` that
# `nih_export_clap!` already emits behind an AudioComponentFactoryFunction named
# `GetPluginFactoryAUV2`. It vendors the free-audio/clap-wrapper C++ and builds it with
# the `cc` crate, so no cmake is involved.
#
# `default-features = false` is load-bearing: the default set includes `vst3`, which
# exports `GetPluginFactory`, `bundleEntry` and `bundleExit` — the exact three symbols
# `nih_export_vst3!` already exports. Enabling it is a duplicate-symbol link error.
#
# Vendored at `deps/clap-wrapper-rs` (crates.io 0.3.1, VST3 SDK removed) because the AUv2
# wrapper needs a patch to reach the plugin's Mono layout — see `deps/PATCHES.md`. Upstream
# grew a `CLAP_WRAPPER_CPP_DIR` escape hatch for exactly this, but only after 0.3.1 shipped,
# so the released build.rs hardcodes its source paths and a path dependency is the only way
# in without taking an unreleased git rev.
[target.'cfg(target_os = "macos")'.dependencies]
clap-wrapper = { path = "deps/clap-wrapper-rs", default-features = false, features = ["auv2", "parallel"] }
# Host/OS identification for the opt-in reporters (src/host.rs). Both were
# already compiled into this target before being declared here — `libc` is an
# unconditional dependency of sentry-contexts, and `core-foundation-sys` arrives
# under both baseview and native-tls — so neither adds build time or binary
# weight, only an explicit edge.
#
# `core-foundation-sys`, NOT the safe `core-foundation` wrapper: its
# `CFBundle::main_bundle()` goes through `wrap_under_get_rule`, which asserts on
# a NULL reference. `CFBundleGetMainBundle()` legitimately returns NULL in an
# unbundled host (auval, clap-validator), and that assert would fire inside the
# host's `extern "C"` activation frame — a DAW abort, not a missing property.
libc = "0.2"
core-foundation-sys = "0.8"

[target.'cfg(target_os = "windows")'.dependencies]
# The host executable's VS_FIXEDFILEINFO block (src/host.rs). `version.dll` has
# no crates.io-free alternative, and windows-sys is bindings only.
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
# The running Windows version, via RtlGetVersion — which, unlike GetVersionEx,
# does not lie to a process with no compatibility manifest. Already in the graph
# here: sentry-contexts uses os_info on Windows (and `uname` elsewhere, which is
# why macOS reads sysctl instead).
os_info = { version = "3", default-features = false }

# Networking for the two opt-in reporters, on the two platforms that ship binaries.
# native-tls is a thin binding to the OS stack — Security.framework on macOS,
# SChannel on Windows — so it needs no build tooling (unlike rustls/ring, which wants
# nasm on the Windows CI) and bundles no root-certificate store to go stale.
#
# Deliberately NOT plain dependencies: on other targets native-tls pulls in openssl
# and its system headers, and Linux is a build-from-source platform here. Both
# reporters are compiled out entirely there instead (`analytics::config_path` returns
# None, the sender is a no-op, and `crash` is a stub) — see src/analytics.rs and
# src/crash.rs.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
native-tls = "0.2"
# Opt-in crash reporting (src/crash.rs), gated on the SAME consent answer as
# analytics. `default-features = false` is load-bearing: the default set includes
# `transport`, which is `["reqwest", "native-tls"]`, and `reqwest` pulls `tokio` —
# a whole async runtime inside every DAW that loads the plugin. `ureq` is declared
# `default-features = false` upstream, so `native-tls` here binds the same OS stack
# the analytics sender already uses: no rustls, no `ring`, and the Windows CI still
# needs no nasm.
#
# `release-health` is what turns crashes into a crash-free session rate, which is the
# one thing the Mixpanel side cannot derive — "Plugin Loaded" counts loads but has no
# idea which of them ended in a panic. `logs` is deliberately absent (nih-plug already
# holds the global `log` logger slot, so sentry-log cannot have it), and so is
# `metrics` (it would only duplicate the bucketed outcomes analytics already sends).
sentry = { version = "0.49.1", default-features = false, features = [
    "backtrace", "contexts", "debug-images", "panic", "release-health",
    "ureq",
] }
# Sentry's own ureq transport configures TLS and proxying but sets NO timeouts, and
# every ureq timeout defaults to None. That matters because `TransportThread::drop`
# joins its worker unconditionally: with a wedged network (captive portal, a firewall
# that blackholes the connection) the join never returns, and the thread it blocks is
# whichever host thread is unloading the plugin. `crash::BoundedUreq` rebuilds the
# agent with the same TLS/proxy setup plus explicit timeouts, which is the only reason
# this is a direct dependency. Version and features mirror what sentry itself asks for,
# so the two unify onto one `ureq::Agent` type.
# MUST be `native-tls`, not `native-tls-no-default`. The latter enables the
# native-tls *crate* but NOT ureq's `src/tls/native_tls.rs`, which is gated on
# `#[cfg(feature = "native-tls")]` — so `TlsProvider::NativeTls` then has no backend
# and ureq panics on the first https request with "provider is NativeTls but feature
# is not enabled". On the sentry transport thread that panic becomes a host abort,
# because `TransportThread::drop` joins with `handle.join().unwrap()`. It crashed
# Ableton Live on plugin removal; see the test in src/crash.rs that now guards it.
#
# This does drag in `webpki-root-certs` (a bundled Mozilla root store). It is dead
# weight rather than a behaviour change: BoundedUreq sets
# `RootCerts::PlatformVerifier`, so TLS still rides the OS trust store.
ureq = { version = "3", default-features = false, features = ["native-tls"] }

[features]
# Dev-only: run the plugin (and its GUI) as a standalone app, no DAW needed:
#   cargo run --bin standalone --features standalone -- --backend dummy
# (Crashes on recent macOS — upstream baseview issue; see src/bin/standalone.rs.)
standalone = ["nih_plug/standalone"]
# Dev-only: render the editor panels with synthetic data to a PNG:
#   cargo run --example gui_preview --features gui-preview
gui-preview = ["dep:egui_kittest", "dep:image"]

[[bin]]
name = "standalone"
path = "src/bin/standalone.rs"
required-features = ["standalone"]

[[example]]
name = "gui_preview"
required-features = ["gui-preview"]

# The baseview rev egui-baseview pins (9a0b42c) null-derefs in
# `becomeFirstResponder` on recent macOS: AppKit invokes it while the view is
# being attached, before it has a window, and `msg_send![nil, ...]` trips
# rustc's null check and aborts the host. Upstream fixed it one commit later
# (RustAudio/baseview#204, rev 3e12973). Cargo forbids patching a git source
# with its own URL, hence the fork. The fork's `magnify-as-ctrl-scroll`
# branch is NO LONGER an unmodified mirror: on top of the #204 fix it carries
# two commits. One delivers macOS `magnifyWithEvent:` (trackpad pinch, which
# stock baseview drops entirely) as a synthetic ctrl-scroll WheelScrolled
# event, calibrated so egui's zoom pipeline applies exp(magnification). The
# other claims keyboard focus on mouseDown (Logic never volunteers it, so the
# ←/→ Trim nudge was dead there), forwards every key but ←/→ back to the host
# so its own commands survive, and stops delivering Cmd — which is what pins
# zoom to Ctrl/pinch, the one modifier that needs no focus. See
# deps/PATCHES.md. When nih-plug / egui-baseview advance past the #204 fix,
# REBASE both commits onto the new rev instead of dropping the patch.
# (Also overrides the `standalone` feature's much older baseview pin — see
# src/bin/standalone.rs.)
[patch."https://github.com/RustAudio/baseview.git"]
baseview = { git = "https://github.com/michaeljancsy/baseview.git", rev = "a8d4bba89f3fa593163bdc027c7f53801d403ade" }

# nih-plug's process-shared background worker thread (the one that runs our per-capture
# Task::Analyze) has two teardown bugs in src/event_loop/background_thread.rs, still
# present at the locked rev f36931f: destroying the last instance while its task is
# running makes the worker thread join *itself* (a panic on macOS, a permanent hang on
# Windows), and a task whose instance was already destroyed shuts the worker down for
# every other instance in the process — after which the last instance's teardown panics
# inside the host. deps/nih-plug is that exact rev with only background_thread.rs
# patched (plus regression tests) and the workspace trimmed to the crates we build —
# see deps/PATCHES.md, and docs/upstream/nih-plug-worker-teardown.md for the issue
# draft to file upstream. `nih_plug_egui` above still resolves from the git source;
# this entry rewires its internal `nih_plug` dependency onto the vendored copy too, so
# exactly one nih_plug exists in the graph. When bumping the nih-plug rev, re-vendor
# and re-apply rather than dropping this — PATCHES.md has the procedure.
[patch."https://github.com/robbert-vdh/nih-plug.git"]
nih_plug = { path = "deps/nih-plug" }

[profile.release]
lto = "thin"
# The shipped binary carries no symbols, but the Mach-O UUID / PE build id survives
# stripping, and that is what lets Sentry match an uploaded debug file. Without these
# two lines a release stack trace is a column of bare addresses. `packed` runs
# dsymutil, so the debuginfo lands in a .dSYM beside the binary rather than in it —
# scripts/release.sh and the Windows workflow upload that, they do not ship it.
strip = "symbols"
debug = "limited"
split-debuginfo = "packed"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"
