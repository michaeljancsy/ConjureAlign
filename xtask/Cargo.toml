[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[dependencies]
nih_plug_xtask = { git = "https://github.com/robbert-vdh/nih-plug.git" }
# For the AudioUnit bundling step. All four already come in via nih_plug_xtask, so keep the
# versions in step to stop Cargo resolving a second copy of any of them.
anyhow = "1.0"
cargo_metadata = "0.18.1"
serde = { version = "1.0", features = ["derive"] }
toml = "0.7"
